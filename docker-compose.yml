services:
  refresh:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TWIN_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
