services:
  fuseki:
    build:
      context: ./fuseki
      dockerfile: Dockerfile
    volumes:
      - fuseki-data:/fuseki/databases
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3030/$/ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  refresh:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      fuseki:
        condition: service_healthy
    environment:
      TWIN_GRAPH_STORE_URL: http://fuseki:3030/twin/data?default
    volumes:
      - ./data:/app/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TWIN_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  fuseki-data:
