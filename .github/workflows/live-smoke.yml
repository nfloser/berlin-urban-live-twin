name: Live source smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build live runtime services
        run: docker compose build fuseki refresh backend

      - name: Start persistent graph store
        run: |
          docker compose up -d fuseki
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://localhost:3030/$/ping' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs fuseki
          exit 1

      - name: Refresh real Berlin urban data
        run: docker compose run --rm refresh

      - name: Start API against refreshed persistent graph
        run: |
          docker compose up -d backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify live semantic state
        run: |
          curl --fail --silent --show-error http://localhost:8000/ready
          curl --fail --silent --show-error http://localhost:8000/state
          curl --fail --silent --show-error http://localhost:8000/freshness
          curl --fail --silent --show-error http://localhost:8000/air-quality
          curl --fail --silent --show-error http://localhost:8000/weather
          curl --fail --silent --show-error http://localhost:8000/transit
          curl --fail --silent --show-error http://localhost:8000/urban-stress

      - name: Show runtime logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop runtime stack
        if: always()
        run: docker compose down --volumes
