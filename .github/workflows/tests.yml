name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test air quality agent
        working-directory: agents/air-quality-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test weather agent
        working-directory: agents/weather-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test transit agent
        working-directory: agents/transit-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test analysis agent
        working-directory: agents/analysis-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test orchestration scripts
        run: |
          python -m pip install "pytest>=8,<9"
          PYTHONPATH=. pytest -q scripts/tests

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build service images
        run: docker compose build

      - name: Start persistent graph store
        run: |
          docker compose up -d fuseki
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://localhost:3030/$/ping' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs fuseki
          exit 1

      - name: Seed deterministic integration graph
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).isoformat()
          Path('/tmp/twin-ci.ttl').write_text(f'''@prefix city: <https://example.org/berlin/ontology/> .
          @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
          <https://example.org/station/CI001> a city:AirQualityStation ; city:stationCode "CI001" ; city:isActive true .
          <https://example.org/air/ci> a city:AirQualityIndexObservation ; city:observedAt "{now}"^^xsd:dateTime .
          <https://example.org/weather/ci> a city:WeatherObservation ; city:observedAt "{now}"^^xsd:dateTime .
          <https://example.org/transit/ci> a city:TransitObservation ; city:observedAt "{now}"^^xsd:dateTime .
          <https://example.org/stress/ci> a city:UrbanStressObservation ; city:observedAt "{now}"^^xsd:dateTime .
          ''', encoding='utf-8')
          PY
          curl --fail --silent --show-error \
            --request PUT \
            --header 'Content-Type: text/turtle' \
            --data-binary @/tmp/twin-ci.ttl \
            'http://localhost:3030/twin/data?default'

      - name: Start backend against Fuseki
        run: |
          docker compose up -d backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify Graph Store to API integration
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen('http://localhost:8000/state', timeout=5) as response:
              state = json.load(response)
          assert state['active_air_quality_stations'] == 1, state
          assert state['triple_count'] >= 9, state

          with urlopen('http://localhost:8000/freshness', timeout=5) as response:
              freshness = json.load(response)
          assert all(item['status'] == 'fresh' for item in freshness.values()), freshness
          PY

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes
