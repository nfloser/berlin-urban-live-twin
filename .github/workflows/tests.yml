name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test air quality agent
        working-directory: agents/air-quality-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test weather agent
        working-directory: agents/weather-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test transit agent
        working-directory: agents/transit-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test analysis agent
        working-directory: agents/analysis-agent
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          PYTHONPATH=. pytest -q

      - name: Test orchestration and SHACL validation
        run: |
          python -m pip install "pytest>=8,<9" "rdflib>=7,<8" "pyshacl>=0.30,<1.0" requests
          PYTHONPATH=. pytest -q scripts/tests

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build service images
        run: docker compose build

      - name: Start persistent graph store
        run: |
          docker compose up -d fuseki
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://localhost:3030/$/ping' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs fuseki
          exit 1

      - name: Seed deterministic integration graph
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).isoformat()
          Path('/tmp/twin-ci.ttl').write_text(f'''@prefix city: <https://example.org/berlin/ontology/> .
          @prefix geo: <http://www.w3.org/2003/01/geo/wgs84_pos#> .
          @prefix prov: <http://www.w3.org/ns/prov#> .
          @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
          <https://example.org/station/CI001> a city:AirQualityStation ;
              city:stationCode "CI001" ; city:name "CI Station" ; city:isActive true ;
              geo:lat "52.52"^^xsd:double ; geo:long "13.405"^^xsd:double .
          <https://example.org/air/ci> a city:AirQualityIndexObservation ;
              city:observedAt "{now}"^^xsd:dateTime ; city:airQualityGrade 2 ;
              city:observedAtStation <https://example.org/station/CI001> ;
              city:lqiO3 2 ; prov:wasDerivedFrom <https://luftdaten.berlin.de/api/lqis/data> .
          <https://example.org/weather/ci> a city:WeatherObservation ;
              city:observedAt "{now}"^^xsd:dateTime ; city:temperatureCelsius "18.2"^^xsd:double ;
              city:relativeHumidityPercent "63.0"^^xsd:double ;
              prov:wasDerivedFrom <https://api.brightsky.dev/current_weather> .
          <https://example.org/transit/ci> a city:TransitObservation ;
              city:observedAt "{now}"^^xsd:dateTime ; city:totalTripUpdates 200 ;
              city:delayedTripUpdates 40 ; city:maxDelaySeconds 420 ; city:delayedShare "0.2"^^xsd:double ;
              prov:wasDerivedFrom <https://production.gtfsrt.vbb.de/data> .
          <https://example.org/stress/ci> a city:UrbanStressObservation ;
              city:observedAt "{now}"^^xsd:dateTime ; city:urbanStressIndex "31.0"^^xsd:double ;
              city:airQualityStressComponent "0.2"^^xsd:double ; city:heatStressComponent "0.0"^^xsd:double ;
              city:transitStressComponent "0.4"^^xsd:double ;
              prov:wasDerivedFrom <https://luftdaten.berlin.de/api/lqis/data>,
                  <https://api.brightsky.dev/current_weather>, <https://production.gtfsrt.vbb.de/data> .
          ''', encoding='utf-8')
          PY
          curl --fail --silent --show-error \
            --request PUT \
            --header 'Content-Type: text/turtle' \
            --data-binary @/tmp/twin-ci.ttl \
            'http://localhost:3030/twin/data?default'

      - name: Start backend against Fuseki
        run: |
          docker compose up -d backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Verify persistent SPARQL to API integration
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          def get(path):
              with urlopen(f'http://localhost:8000{path}', timeout=5) as response:
                  return json.load(response)

          ready = get('/ready')
          assert ready['status'] == 'ready', ready

          state = get('/state')
          assert state['active_air_quality_stations'] == 1, state
          assert state['triple_count'] >= 30, state

          freshness = get('/freshness')
          assert all(item['status'] == 'fresh' for item in freshness.values()), freshness

          stations = get('/stations')
          assert stations[0]['code'] == 'CI001', stations
          assert get('/air-quality')['worst_grade'] == 2
          assert get('/weather')['temperature_c'] == 18.2
          assert get('/transit')['delayed_trip_updates'] == 40
          assert get('/urban-stress')['index'] == 31.0

          provenance = get('/provenance')
          assert any(item['source'] == 'https://production.gtfsrt.vbb.de/data' for item in provenance), provenance
          PY

      - name: Stop integration stack
        if: always()
        run: docker compose down --volumes
